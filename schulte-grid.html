<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e9">
  <title>舒尔特方格 · Up Mr.Peng 脑力训练</title>
  <style>
:root {
  --canvas: #f4f1e9;
  --paper: #fffdf8;
  --ink: #17342e;
  --muted: #68766f;
  --line: #d9ded5;
  --green: #245f50;
  --green-deep: #17473c;
  --mint: #dcece5;
  --coral: #d85f42;
  --yellow: #f3c85b;
  --red: #c64747;
  --blue: #3d76ad;
  --shadow: 0 20px 55px rgba(27, 58, 49, 0.12);
}

* { box-sizing: border-box; }

html {
  min-height: 100%;
  touch-action: manipulation;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  background:
    radial-gradient(circle at 8% 8%, rgba(255,255,255,.95), transparent 25rem),
    radial-gradient(circle at 92% 15%, rgba(243, 200, 91, .3), transparent 22rem),
    radial-gradient(circle at 1px 1px, rgba(36, 95, 80, .085) 1px, transparent 0) 0 0 / 24px 24px,
    var(--canvas);
}

button, input { font: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  border-bottom: 1px solid rgba(196, 204, 194, .75);
  background: rgba(244, 241, 233, .91);
  backdrop-filter: blur(14px);
}

.topbar-inner {
  width: min(1120px, calc(100% - 28px));
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
  font-weight: 800;
}

.brand-mark {
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: #fff;
  background: linear-gradient(145deg, #3f816e, var(--green) 58%, var(--green-deep));
  box-shadow: 0 9px 20px rgba(36, 95, 80, .22);
  font-family: Georgia, serif;
}

.brand small { color: var(--coral); font-weight: 800; }

.top-actions { display: flex; gap: 8px; }

.icon-button {
  min-height: 40px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink);
  background: rgba(255, 253, 248, .8);
  font-size: 12px;
  font-weight: 800;
}

.icon-button:hover { border-color: var(--green); }

.page {
  width: min(1060px, calc(100% - 28px));
  margin: auto;
  padding: 28px 0 54px;
}

.panel {
  min-height: calc(100vh - 150px);
  display: grid;
  place-items: center;
  padding: 20px 0;
}

.card {
  width: min(760px, 100%);
  padding: clamp(24px, 4.5vw, 44px);
  border: 1px solid var(--line);
  border-radius: 30px;
  background: var(--paper);
  box-shadow: var(--shadow);
}

.eyebrow {
  margin: 0 0 9px;
  color: var(--coral);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .15em;
}

h1, h2, p { margin-top: 0; }

h1 {
  margin-bottom: 12px;
  font-family: "Noto Serif SC", "SimSun", serif;
  font-size: clamp(36px, 7vw, 62px);
  line-height: 1.08;
}

.intro {
  max-width: 620px;
  margin-bottom: 25px;
  color: var(--muted);
  line-height: 1.85;
}

.mode-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin: 22px 0 15px;
}

.mode-button {
  padding: 14px 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  color: var(--ink);
  background: #f8f7f1;
  text-align: left;
  transition: transform .16s ease, border-color .16s ease, background .16s ease;
}

.mode-button:hover { transform: translateY(-2px); border-color: var(--green); }
.mode-button.is-active { border-color: var(--green); background: var(--mint); }
.mode-button strong { display: block; font-size: 15px; }
.mode-button small { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.5; }

.record-line {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 14px 0 20px;
  padding: 12px 14px;
  border: 1px dashed rgba(36, 95, 80, .28);
  border-radius: 12px;
  color: var(--muted);
  background: rgba(220, 236, 229, .45);
  font-size: 12px;
  font-weight: 700;
}

.primary-button {
  min-height: 52px;
  padding: 0 24px;
  border: 0;
  border-radius: 999px;
  color: #fff;
  background: var(--green);
  box-shadow: 0 10px 22px rgba(36, 95, 80, .22);
  font-weight: 900;
}

.primary-button:hover { background: var(--green-deep); }

.secondary-button {
  min-height: 48px;
  padding: 0 20px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--green-deep);
  background: #fff;
  font-weight: 800;
}

.game-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.exit-button {
  min-height: 38px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  background: rgba(255,255,255,.72);
  font-size: 12px;
  font-weight: 800;
}

.round-label {
  padding: 8px 14px;
  border-radius: 999px;
  color: var(--green-deep);
  background: var(--mint);
  font-size: 12px;
  font-weight: 900;
}

.hud {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  width: min(760px, 100%);
  margin: 0 auto 12px;
}

.hud-card {
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255, 253, 248, .82);
  text-align: center;
}

.hud-card span { display: block; color: var(--muted); font-size: 10px; font-weight: 700; }
.hud-card strong { display: block; margin-top: 2px; font-size: 20px; }

.game-card {
  width: min(820px, 100%);
  padding: clamp(18px, 3.5vw, 30px);
  border: 1px solid var(--line);
  border-radius: 26px;
  background: var(--paper);
  box-shadow: var(--shadow);
}

.game-prompt {
  margin-bottom: 16px;
  text-align: center;
}

.game-prompt h2 { margin-bottom: 7px; font-size: clamp(25px, 4vw, 36px); }
.game-prompt p { margin-bottom: 0; color: var(--muted); font-size: 13px; }

.progress-line {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}

.board {
  display: grid;
  grid-template-columns: repeat(var(--size, 4), minmax(0, 1fr));
  gap: clamp(6px, 1.3vw, 12px);
  width: min(650px, 100%);
  aspect-ratio: 1;
  margin: auto;
}

.board-cell {
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: clamp(8px, 1.8vw, 16px);
  color: var(--green-deep);
  background: #fff;
  font-family: Consolas, "Courier New", monospace;
  font-size: clamp(18px, 4vw, 38px);
  font-weight: 900;
  transition: transform .12s ease, background .12s ease, opacity .12s ease;
}

.board-cell:hover { transform: translateY(-1px); border-color: var(--green); }
.board-cell.is-solved { color: #fff; background: var(--green); border-color: var(--green); opacity: .58; }
.board-cell.is-wrong { color: #fff; background: var(--red); border-color: var(--red); }

.feedback {
  min-height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 14px;
  padding: 8px 12px;
  border-radius: 12px;
  color: var(--muted);
  background: #f5f4ee;
  font-size: 12px;
  font-weight: 800;
  text-align: center;
}

.feedback.is-good { color: var(--green-deep); background: var(--mint); }
.feedback.is-bad { color: #8d2f2f; background: #fbe4df; }

.stroop-word {
  min-height: 210px;
  display: grid;
  place-items: center;
  margin: 8px auto 18px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background:
    radial-gradient(circle at 50% 40%, #fff, #f5f4ed);
  font-family: "Microsoft YaHei", sans-serif;
  font-size: clamp(72px, 18vw, 145px);
  font-weight: 950;
  line-height: 1;
  user-select: none;
}

.color-options {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  width: min(620px, 100%);
  margin: auto;
}

.color-button {
  min-height: 68px;
  border: 4px solid rgba(255,255,255,.78);
  border-radius: 16px;
  color: #fff;
  box-shadow: 0 5px 15px rgba(23, 52, 46, .16);
  font-size: 15px;
  font-weight: 950;
}

.color-button:hover { transform: translateY(-2px); }

.rating {
  width: fit-content;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 8px auto 12px;
  padding: 7px 14px 7px 8px;
  border: 1px solid rgba(216, 95, 66, .28);
  border-radius: 999px;
  color: #873723;
  background: #fff4d6;
  font-size: 12px;
  font-weight: 900;
}

.rating strong {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  background: var(--coral);
  font-family: Georgia, serif;
  font-size: 19px;
}

.result-card { text-align: center; }
.result-card h1 { margin-bottom: 8px; }
.result-score { margin: 7px 0; color: var(--coral); font-family: Georgia, serif; font-size: clamp(52px, 12vw, 86px); font-weight: 700; }
.breakdown { margin-bottom: 18px; color: var(--muted); font-size: 12px; font-weight: 700; }

.result-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
  gap: 9px;
  margin: 18px 0 22px;
}

.result-stat {
  padding: 13px 8px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #f6f4ed;
}

.result-stat strong { display: block; color: var(--green-deep); font-size: 22px; }
.result-stat span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 800; }

.result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 80;
  max-width: calc(100% - 30px);
  padding: 11px 15px;
  border-radius: 12px;
  color: #fff;
  background: rgba(23, 52, 46, .94);
  opacity: 0;
  transform: translate(-50%, 10px);
  transition: opacity .2s, transform .2s;
  pointer-events: none;
  font-size: 12px;
  font-weight: 700;
}

.toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

body.is-paused .game-card::after {
  content: "暂停中";
  position: fixed;
  inset: 64px 0 0;
  z-index: 20;
  display: grid;
  place-items: center;
  color: var(--green-deep);
  background: rgba(244, 241, 233, .88);
  font-size: 26px;
  font-weight: 900;
}

@media (max-width: 680px) {
  .brand small { display: none; }
  .page { width: min(100% - 14px, 1060px); padding-top: 10px; }
  .panel { min-height: calc(100dvh - 90px); padding: 8px 0 20px; }
  .card, .game-card { border-radius: 20px; }
  .mode-grid { grid-template-columns: 1fr; }
  .hud { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  .hud-card { padding: 6px 3px; }
  .hud-card strong { font-size: 16px; }
  .board-cell { font-size: clamp(18px, 8vw, 30px); }
  .stroop-word { min-height: 155px; font-size: clamp(64px, 22vw, 104px); }
  .color-options { gap: 7px; }
  .color-button { min-height: 58px; border-width: 3px; font-size: 13px; }
  .result-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .top-actions .icon-button { padding: 0 10px; }
}

  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">Up</span>
        <span><strong>Mr.Peng</strong> <small>· 舒尔特方格</small></span>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="fullscreenButton" type="button">全屏</button>
        <button class="icon-button" id="soundButton" type="button">声音：开</button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="panel" id="startView">
      <div class="card">
        <p class="eyebrow">VISUAL SEARCH · ATTENTION</p>
        <h1>舒尔特方格</h1>
        <p class="intro">从 1 开始，按顺序尽快找到所有数字。眼睛不要只盯着一个位置，试着扩大视野，用余光扫描整个方格。</p>

        <div class="mode-grid" role="group" aria-label="选择方格难度">
          <button class="mode-button is-active" type="button" data-size="4">
            <strong>4 × 4</strong>
            <small>16 个数字 · 入门</small>
          </button>
          <button class="mode-button" type="button" data-size="5">
            <strong>5 × 5</strong>
            <small>25 个数字 · 标准</small>
          </button>
          <button class="mode-button" type="button" data-size="6">
            <strong>6 × 6</strong>
            <small>36 个数字 · 挑战</small>
          </button>
        </div>

        <div class="record-line">
          <span>当前难度：<strong id="selectedMode">4 × 4</strong></span>
          <span id="startRecord">还没有记录</span>
        </div>

        <button class="primary-button" id="startButton" type="button">开始挑战</button>
      </div>
    </section>

    <section id="gameView" hidden>
      <div class="game-head">
        <button class="exit-button" id="exitButton" type="button">结束练习</button>
        <div class="round-label" id="roundLabel">4 × 4</div>
        <span aria-hidden="true"></span>
      </div>

      <div class="hud">
        <div class="hud-card"><span>用时</span><strong id="timeValue">0.00s</strong></div>
        <div class="hud-card"><span>进度</span><strong id="progressValue">0 / 16</strong></div>
        <div class="hud-card"><span>失误</span><strong id="errorValue">0</strong></div>
        <div class="hud-card"><span>连对</span><strong id="streakValue">×0</strong></div>
      </div>

      <div class="game-card">
        <div class="game-prompt">
          <h2>寻找数字 <span id="nextValue">1</span></h2>
          <p>按从小到大的顺序点击，点错会记录一次失误。</p>
        </div>
        <div class="progress-line">
          <span>当前目标 <strong id="targetValue">1</strong></span>
          <span>保持稳定的视线移动</span>
        </div>
        <div class="board" id="board" role="grid" aria-label="舒尔特数字方格"></div>
        <div class="feedback" id="feedback" aria-live="polite">准备好后，从 1 开始。</div>
      </div>
    </section>

    <section class="panel" id="resultView" hidden>
      <div class="card result-card">
        <p class="eyebrow">RESULT · VISUAL SEARCH</p>
        <h1 id="resultTitle">挑战完成</h1>
        <div class="rating"><strong id="resultRating">B</strong><span id="resultRatingCopy">稳步提升</span></div>
        <div class="result-score" id="resultScore">0</div>
        <p class="breakdown" id="resultBreakdown"></p>
        <div class="result-stats">
          <div class="result-stat"><strong id="resultTime">0.00s</strong><span>完成用时</span></div>
          <div class="result-stat"><strong id="resultErrors">0</strong><span>失误次数</span></div>
          <div class="result-stat"><strong id="resultStreak">0</strong><span>最佳连对</span></div>
          <div class="result-stat"><strong id="resultBest">0</strong><span>本难度最高分</span></div>
        </div>
        <div class="result-actions">
          <button class="primary-button" id="replayButton" type="button">再挑战一次</button>
          <button class="secondary-button" id="changeButton" type="button">调整难度</button>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

    startView: document.querySelector("#startView"),
    gameView: document.querySelector("#gameView"),
    resultView: document.querySelector("#resultView"),
    modeButtons: [...document.querySelectorAll(".mode-button")],
    selectedMode: document.querySelector("#selectedMode"),
    startRecord: document.querySelector("#startRecord"),
    startButton: document.querySelector("#startButton"),
    exitButton: document.querySelector("#exitButton"),
    roundLabel: document.querySelector("#roundLabel"),
    timeValue: document.querySelector("#timeValue"),
    progressValue: document.querySelector("#progressValue"),
    errorValue: document.querySelector("#errorValue"),
    streakValue: document.querySelector("#streakValue"),
    nextValue: document.querySelector("#nextValue"),
    targetValue: document.querySelector("#targetValue"),
    board: document.querySelector("#board"),
    feedback: document.querySelector("#feedback"),
    resultTitle: document.querySelector("#resultTitle"),
    resultRating: document.querySelector("#resultRating"),
    resultRatingCopy: document.querySelector("#resultRatingCopy"),
    resultScore: document.querySelector("#resultScore"),
    resultBreakdown: document.querySelector("#resultBreakdown"),
    resultTime: document.querySelector("#resultTime"),
    resultErrors: document.querySelector("#resultErrors"),
    resultStreak: document.querySelector("#resultStreak"),
    resultBest: document.querySelector("#resultBest"),
    replayButton: document.querySelector("#replayButton"),
    changeButton: document.querySelector("#changeButton"),
    fullscreenButton: document.querySelector("#fullscreenButton"),
    soundButton: document.querySelector("#soundButton"),
    toast: document.querySelector("#toast"),
  };

  const state = {
    size: 4,
    expected: 1,
    errors: 0,
    streak: 0,
    bestStreak: 0,
    elapsedMs: 0,
    active: false,
    lastTick: 0,
    timer: 0,
    board: [],
  };

  function setView(name) {
    elements.startView.hidden = name !== "start";
    elements.gameView.hidden = name !== "game";
    elements.resultView.hidden = name !== "result";
  }

  function getRecords() {
    const records = common.readRecords("schulte");
    if (!records.sizes || typeof records.sizes !== "object") {
      records.sizes = {};
    }
    return records;
  }

  function getRecord(size = state.size) {
    const record = getRecords().sizes[String(size)];
    return record && typeof record === "object"
      ? {
        bestScore: Number(record.bestScore) || 0,
        bestTime: Number(record.bestTime) || 0,
      }
      : { bestScore: 0, bestTime: 0 };
  }

  function saveResult(score, durationMs) {
    const records = getRecords();
    const previous = getRecord();
    records.sizes[String(state.size)] = {
      bestScore: Math.max(previous.bestScore, score),
      bestTime: previous.bestTime > 0
        ? Math.min(previous.bestTime, durationMs)
        : durationMs,
    };
    common.saveRecords("schulte", records);
  }

  function updateRecordDisplay() {
    const record = getRecord();
    elements.selectedMode.textContent = `${state.size} × ${state.size}`;
    elements.startRecord.textContent = record.bestScore > 0
      ? `最佳 ${core.formatTime(record.bestTime)} · ${common.scoreLabel(record.bestScore)} 分`
      : "还没有记录";
  }

  function updateHud() {
    elements.timeValue.textContent = core.formatTime(state.elapsedMs);
    elements.progressValue.textContent = `${Math.max(0, state.expected - 1)} / ${state.size * state.size}`;
    elements.errorValue.textContent = String(state.errors);
    elements.streakValue.textContent = `×${state.streak}`;
    elements.nextValue.textContent = String(state.expected);
    elements.targetValue.textContent = String(state.expected);
  }

  function setFeedback(message, tone = "") {
    elements.feedback.textContent = message;
    elements.feedback.classList.toggle("is-good", tone === "good");
    elements.feedback.classList.toggle("is-bad", tone === "bad");
  }

  function renderBoard() {
    elements.board.style.setProperty("--size", String(state.size));
    elements.board.replaceChildren();
    state.board.forEach((value) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "board-cell";
      button.dataset.value = String(value);
      button.textContent = String(value);
      button.setAttribute("aria-label", `数字 ${value}`);
      button.addEventListener("click", () => handleCell(button, value));
      elements.board.append(button);
    });
  }

  function startTimer() {
    window.clearInterval(state.timer);
    state.lastTick = performance.now();
    state.timer = window.setInterval(() => {
      if (!state.active) return;
      const now = performance.now();
      if (!document.hidden) {
        state.elapsedMs += now - state.lastTick;
        elements.timeValue.textContent = core.formatTime(state.elapsedMs);
      }
      state.lastTick = now;
    }, 50);
  }

  function startGame() {
    sound.ensure();
    sound.click();
    state.expected = 1;
    state.errors = 0;
    state.streak = 0;
    state.bestStreak = 0;
    state.elapsedMs = 0;
    state.active = true;
    state.board = core.createBoard(state.size);
    renderBoard();
    elements.roundLabel.textContent = `${state.size} × ${state.size}`;
    setFeedback("从 1 开始，尽量用余光扫描整个方格。");
    updateHud();
    setView("game");
    window.scrollTo({ top: 0, behavior: "auto" });
    startTimer();
  }

  function finishGame() {
    state.active = false;
    window.clearInterval(state.timer);
    const total = state.size * state.size;
    const duration = Math.max(1, state.elapsedMs);
    const ratio = scoring.speedRatio(duration, total * 450);
    const roundScore = scoring.schulteRoundScore({
      size: state.size,
      durationMs: duration,
      errors: state.errors,
    });
    const performance = scoring.schultePerformance({
      size: state.size,
      durationMs: duration,
      errors: state.errors,
      speedRatio: ratio,
    });
    saveResult(roundScore.total, duration);
    sound.correct();

    elements.resultTitle.textContent = "方格挑战完成";
    elements.resultRating.textContent = performance.grade;
    elements.resultRatingCopy.textContent = RATING_COPY[performance.grade];
    elements.resultScore.textContent = common.scoreLabel(roundScore.total);
    elements.resultBreakdown.textContent =
      `基础分 ${roundScore.base} · 速度奖励 ${roundScore.speed} · `
      + `完美奖励 ${roundScore.perfect} · 失误扣分 ${roundScore.penalty}`;
    elements.resultTime.textContent = core.formatTime(duration);
    elements.resultErrors.textContent = String(state.errors);
    elements.resultStreak.textContent = String(state.bestStreak);
    elements.resultBest.textContent = common.scoreLabel(Math.max(getRecord().bestScore, roundScore.total));
    updateRecordDisplay();
    setView("result");
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function handleCell(button, value) {
    if (!state.active || button.classList.contains("is-solved")) return;
    const result = core.evaluateTap(state.expected, value, state.size * state.size);
    if (result.status === "wrong") {
      state.errors += 1;
      state.streak = 0;
      button.classList.add("is-wrong");
      window.setTimeout(() => button.classList.remove("is-wrong"), 260);
      sound.wrong();
      setFeedback(`当前应该找 ${state.expected}，再看一次整个方格。`, "bad");
      updateHud();
      return;
    }

    state.expected = result.next;
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    button.classList.add("is-solved");
    button.disabled = true;
    sound.click();
    setFeedback(result.complete ? "全部找到！" : `找到 ${value}，继续。`, "good");
    updateHud();
    if (result.complete) finishGame();
  }

  function returnToStart() {
    state.active = false;
    window.clearInterval(state.timer);
    updateRecordDisplay();
    setView("start");
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function isFullscreen() {
    return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
  }

  async function toggleFullscreen() {
    try {
      if (isFullscreen()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        await exit.call(document);
        elements.fullscreenButton.textContent = "全屏";
      } else {
        const root = document.documentElement;
        const request = root.requestFullscreen || root.webkitRequestFullscreen;
        if (!request) throw new Error("unsupported");
        await request.call(root);
        elements.fullscreenButton.textContent = "退出全屏";
      }
    } catch {
      common.showToast("当前浏览器无法切换全屏，可尝试按 F11。");
    }
  }

  elements.modeButtons.forEach((button) => {
    button.addEventListener("click", () => {
      state.size = Number(button.dataset.size);
      elements.modeButtons.forEach((item) => item.classList.toggle("is-active", item === button));
      updateRecordDisplay();
      sound.click();
    });
  });
  elements.startButton.addEventListener("click", startGame);
  elements.replayButton.addEventListener("click", startGame);
  elements.changeButton.addEventListener("click", returnToStart);
  elements.exitButton.addEventListener("click", returnToStart);
  elements.fullscreenButton.addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", () => {
    elements.fullscreenButton.textContent = isFullscreen() ? "退出全屏" : "全屏";
  });

  common.bindSoundButton(elements.soundButton, sound);
  updateRecordDisplay();
})();

  </script>
</body>
</html>
